databases:
  - name: proposal-db
    databaseName: proposal
    user: proposal
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: proposal-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: proposal-db
          property: connectionString

      # Signs session cookies and keys the code digests.
      - key: JWT_SECRET
        generateValue: true

      # Почта владельца площадки — этот аккаунт становится суперадмином.
      - key: OWNER_EMAIL
        sync: false

      # Ротация предложений главной страницы: 2 или 3 дня.
      - key: OFFER_ROTATION_DAYS
        value: "3"

      # Комиссия площадки с суммы сделки.
      - key: PLATFORM_FEE_RATE
        value: "0.08"

      # Exact origin(s) of the Vercel frontend, comma-separated.
      - key: ALLOWED_ORIGINS
        sync: false

      # ── Почта ──────────────────────────────────────────────────────
      # Render закрывает исходящие SMTP-порты (25/465/587), поэтому здесь
      # работает только HTTP API: BREVO_API_KEY + подтверждённый MAIL_FROM.
      # SMTP-переменные оставлены для локальной разработки и хостингов без
      # блокировок; на Render их можно не заполнять.
      #
      #   BREVO_API_KEY — ключ xkeysib-… с https://app.brevo.com/settings/keys/api
      #   MAIL_FROM     — адрес, подтверждённый на https://app.brevo.com/senders/list
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: MAIL_PRIMARY
        value: brevo

      # Запасные транспорты — необязательные.
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
