databases:
  - name: proposal-db
    databaseName: proposal
    user: proposal
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: proposal-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: proposal-db
          property: connectionString

      # Signs session cookies and keys the code digests.
      - key: JWT_SECRET
        generateValue: true

      # Exact origin(s) of the Vercel frontend, comma-separated.
      - key: ALLOWED_ORIGINS
        sync: false

      # Email: configure Resend OR the SMTP block.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
